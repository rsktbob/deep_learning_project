<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1300" viewBox="0 0 1800 1300">
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#063e78"/>
      <stop offset="0.55" stop-color="#0c5aa2"/>
      <stop offset="1" stop-color="#063e78"/>
    </linearGradient>
    <linearGradient id="softBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="softGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4fff7"/>
      <stop offset="1" stop-color="#e8f8ee"/>
    </linearGradient>
    <linearGradient id="softOrange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf1"/>
      <stop offset="1" stop-color="#fff1da"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0a3d70" flood-opacity="0.13"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1769aa"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f8b57"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dd7a18"/>
    </marker>
    <style>
      text { font-family: "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; fill: #102a43; }
      .title { font-size: 48px; font-weight: 800; fill: white; letter-spacing: 1px; }
      .subtitle { font-size: 22px; font-weight: 600; fill: #e2f0ff; }
      .section-title { font-size: 22px; font-weight: 800; fill: white; }
      .card-title { font-size: 25px; font-weight: 800; fill: #073f78; }
      .card-subtitle { font-size: 17px; font-weight: 700; fill: #1769aa; }
      .body { font-size: 17px; fill: #243b53; }
      .small { font-size: 15px; fill: #486581; }
      .tiny { font-size: 13px; fill: #486581; }
      .white { fill: white; }
      .center { text-anchor: middle; }
      .bold { font-weight: 800; }
      .mono { font-family: Consolas, "Microsoft JhengHei", monospace; }
      .pill { font-size: 15px; font-weight: 800; fill: white; text-anchor: middle; }
      .node-title { font-size: 18px; font-weight: 800; text-anchor: middle; }
      .node-text { font-size: 14px; text-anchor: middle; fill: #486581; }
      .flow-label { font-size: 14px; font-weight: 800; fill: #1769aa; text-anchor: middle; }
      .metric { font-size: 16px; font-weight: 800; fill: #073f78; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1800" height="1300" fill="#f3f8fe"/>
  <circle cx="1650" cy="114" r="150" fill="#dceeff" opacity="0.35"/>
  <circle cx="115" cy="1170" r="180" fill="#dceeff" opacity="0.3"/>

  <!-- Header -->
  <rect x="18" y="18" width="1764" height="128" rx="18" fill="url(#headerGradient)" filter="url(#shadow)"/>
  <text x="900" y="76" class="title center">台股 FinRL 深度強化學習交易系統架構</text>
  <text x="900" y="116" class="subtitle center">30 家重要台股・7 種演算法・每日資產配置・統一回測與比較</text>

  <!-- Section headers -->
  <rect x="30" y="172" width="510" height="42" rx="8" fill="#073f78"/>
  <text x="52" y="201" class="section-title">1. 資料層與交易環境</text>
  <rect x="565" y="172" width="675" height="42" rx="8" fill="#073f78"/>
  <text x="587" y="201" class="section-title">2. 強化學習核心與七種演算法</text>
  <rect x="1265" y="172" width="505" height="42" rx="8" fill="#073f78"/>
  <text x="1287" y="201" class="section-title">3. 回測、比較與網頁輸出</text>

  <!-- Left: stock universe -->
  <rect x="30" y="228" width="510" height="252" rx="14" fill="white" stroke="#a9c9e8" stroke-width="2" filter="url(#shadow)"/>
  <text x="54" y="266" class="card-title">台股股票池與市場資料</text>
  <text x="54" y="298" class="body">從台灣大型權值股建立共同訓練與回測資料。</text>
  <rect x="54" y="320" width="134" height="38" rx="19" fill="#1769aa"/>
  <text x="121" y="345" class="pill">30 家重要公司</text>
  <rect x="198" y="320" width="134" height="38" rx="19" fill="#2f8b57"/>
  <text x="265" y="345" class="pill">Yahoo Finance</text>
  <rect x="342" y="320" width="158" height="38" rx="19" fill="#dd7a18"/>
  <text x="421" y="345" class="pill">.TW 台股代碼</text>
  <line x1="54" y1="380" x2="516" y2="380" stroke="#d7e6f5"/>
  <text x="54" y="408" class="card-subtitle">代表公司</text>
  <text x="54" y="436" class="body">台積電、聯發科、鴻海、台達電、金融與傳產權值股</text>
  <text x="54" y="463" class="small mono">taiwan_stocks.py → train_data.csv / trade_data.csv</text>

  <!-- Left: preprocessing -->
  <rect x="30" y="500" width="510" height="284" rx="14" fill="white" stroke="#a9c9e8" stroke-width="2" filter="url(#shadow)"/>
  <text x="54" y="538" class="card-title">資料處理與狀態 State</text>
  <rect x="54" y="562" width="205" height="78" rx="10" fill="url(#softBlue)" stroke="#81b3df"/>
  <text x="156" y="589" class="node-title">市場原始資料</text>
  <text x="156" y="615" class="node-text">OHLCV・交易日期</text>
  <rect x="310" y="562" width="205" height="78" rx="10" fill="url(#softBlue)" stroke="#81b3df"/>
  <text x="412" y="589" class="node-title">技術指標</text>
  <text x="412" y="615" class="node-text">MACD・RSI・CCI・DX</text>
  <line x1="259" y1="601" x2="302" y2="601" stroke="#1769aa" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <rect x="54" y="668" width="461" height="86" rx="10" fill="url(#softGreen)" stroke="#72b68c"/>
  <text x="284" y="698" class="node-title">交易環境 State 向量</text>
  <text x="284" y="725" class="node-text">現金餘額 + 各股價格 + 持股數量 + 技術指標</text>
  <text x="284" y="747" class="tiny center mono">StockTradingEnv</text>
  <line x1="284" y1="640" x2="284" y2="660" stroke="#2f8b57" stroke-width="3" marker-end="url(#arrowGreen)"/>

  <!-- Left: action/reward -->
  <rect x="30" y="804" width="510" height="252" rx="14" fill="white" stroke="#a9c9e8" stroke-width="2" filter="url(#shadow)"/>
  <text x="54" y="842" class="card-title">每日交易 Action 與 Reward</text>
  <rect x="54" y="868" width="142" height="76" rx="12" fill="#eaf4ff" stroke="#5d9bd3"/>
  <text x="125" y="897" class="node-title">賣出</text>
  <text x="125" y="923" class="node-text">action &lt; 0</text>
  <rect x="214" y="868" width="142" height="76" rx="12" fill="#f3f6f9" stroke="#9fb3c8"/>
  <text x="285" y="897" class="node-title">持有</text>
  <text x="285" y="923" class="node-text">action ≈ 0</text>
  <rect x="374" y="868" width="142" height="76" rx="12" fill="#ecf9f0" stroke="#72b68c"/>
  <text x="445" y="897" class="node-title">買入</text>
  <text x="445" y="923" class="node-text">action &gt; 0</text>
  <rect x="54" y="968" width="462" height="62" rx="10" fill="url(#softOrange)" stroke="#e9b96e"/>
  <text x="285" y="994" class="node-title">Reward：投資組合價值變化</text>
  <text x="285" y="1018" class="node-text">總資產 = 現金 + 所有股票市值</text>

  <!-- Center: training loop -->
  <rect x="565" y="228" width="675" height="548" rx="14" fill="white" stroke="#a9c9e8" stroke-width="2" filter="url(#shadow)"/>
  <text x="590" y="266" class="card-title">每日決策與學習迴圈</text>
  <text x="590" y="296" class="body">模型讀取當日狀態，輸出 30 維連續動作，再依資產變化學習。</text>

  <rect x="610" y="352" width="180" height="104" rx="14" fill="url(#softBlue)" stroke="#5d9bd3" stroke-width="2"/>
  <text x="700" y="386" class="node-title">State sₜ</text>
  <text x="700" y="414" class="node-text">現金・價格・持股</text>
  <text x="700" y="438" class="node-text">技術指標</text>

  <rect x="865" y="330" width="220" height="148" rx="14" fill="url(#softGreen)" stroke="#4c9b69" stroke-width="2"/>
  <text x="975" y="365" class="node-title">RL Agent</text>
  <text x="975" y="394" class="node-text">Actor / Policy Network</text>
  <text x="975" y="420" class="node-text">Critic / Value Network</text>
  <text x="975" y="451" class="tiny center mono">π(a|s), V(s), Q(s,a)</text>

  <rect x="1120" y="352" width="82" height="104" rx="14" fill="url(#softOrange)" stroke="#dd7a18" stroke-width="2"/>
  <text x="1161" y="386" class="node-title">Action</text>
  <text x="1161" y="414" class="node-text">買 / 賣</text>
  <text x="1161" y="438" class="node-text">持有</text>

  <rect x="865" y="548" width="220" height="118" rx="14" fill="#fff8e9" stroke="#e4a33f" stroke-width="2"/>
  <text x="975" y="584" class="node-title">Trading Environment</text>
  <text x="975" y="613" class="node-text">成交、成本、更新持股</text>
  <text x="975" y="640" class="node-text">計算新總資產與 Reward</text>

  <line x1="790" y1="404" x2="855" y2="404" stroke="#1769aa" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="822" y="389" class="flow-label">觀察</text>
  <line x1="1085" y1="404" x2="1110" y2="404" stroke="#1769aa" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <line x1="1161" y1="456" x2="1161" y2="607" stroke="#dd7a18" stroke-width="4"/>
  <line x1="1161" y1="607" x2="1095" y2="607" stroke="#dd7a18" stroke-width="4" marker-end="url(#arrowOrange)"/>
  <text x="1162" y="532" class="flow-label">執行</text>
  <path d="M865 607 C760 607, 760 495, 865 444" fill="none" stroke="#2f8b57" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <text x="765" y="573" class="flow-label">reward rₜ</text>

  <rect x="600" y="695" width="605" height="52" rx="10" fill="#edf5fd" stroke="#9bc2e5"/>
  <text x="902" y="728" class="body center bold">每個交易日重複配置，直到回測期間結束</text>

  <!-- Center: algorithms -->
  <rect x="565" y="796" width="675" height="260" rx="14" fill="white" stroke="#a9c9e8" stroke-width="2" filter="url(#shadow)"/>
  <text x="590" y="834" class="card-title">七種演算法工作台</text>
  <rect x="590" y="862" width="194" height="150" rx="12" fill="#eef6ff" stroke="#81b3df"/>
  <text x="687" y="893" class="card-subtitle center">On-policy</text>
  <rect x="615" y="916" width="65" height="38" rx="19" fill="#1769aa"/>
  <text x="647" y="941" class="pill">PPO</text>
  <rect x="694" y="916" width="65" height="38" rx="19" fill="#1769aa"/>
  <text x="726" y="941" class="pill">A2C</text>
  <text x="687" y="982" class="small center">收集 rollout 後更新</text>

  <rect x="806" y="862" width="194" height="150" rx="12" fill="#fff8e9" stroke="#e9b96e"/>
  <text x="903" y="893" class="card-subtitle center" fill="#a7580e">Off-policy</text>
  <rect x="822" y="916" width="52" height="38" rx="19" fill="#dd7a18"/>
  <text x="848" y="941" class="pill">TD3</text>
  <rect x="880" y="916" width="52" height="38" rx="19" fill="#dd7a18"/>
  <text x="906" y="941" class="pill">SAC</text>
  <rect x="938" y="916" width="52" height="38" rx="19" fill="#dd7a18"/>
  <text x="964" y="941" class="pill">DDPG</text>
  <text x="903" y="982" class="small center">Replay Buffer 持續更新</text>

  <rect x="1022" y="862" width="194" height="150" rx="12" fill="#ecf9f0" stroke="#72b68c"/>
  <text x="1119" y="893" class="card-subtitle center" fill="#247548">Sequence</text>
  <rect x="1040" y="916" width="76" height="38" rx="19" fill="#2f8b57"/>
  <text x="1078" y="941" class="pill">LSTM</text>
  <rect x="1124" y="916" width="76" height="38" rx="19" fill="#2f8b57"/>
  <text x="1162" y="941" class="pill">Mamba</text>
  <text x="1119" y="982" class="small center">保留跨日序列資訊</text>

  <!-- Right: training system -->
  <rect x="1265" y="228" width="505" height="250" rx="14" fill="white" stroke="#a9c9e8" stroke-width="2" filter="url(#shadow)"/>
  <text x="1289" y="266" class="card-title">訓練協調與模型儲存</text>
  <text x="1289" y="300" class="body">FastAPI 建立背景工作，統一呼叫模型訓練與回測。</text>
  <rect x="1289" y="326" width="213" height="74" rx="10" fill="url(#softBlue)" stroke="#81b3df"/>
  <text x="1395" y="356" class="node-title">演算法預設參數</text>
  <text x="1395" y="382" class="node-text mono">algorithm_defaults.py</text>
  <rect x="1530" y="326" width="213" height="74" rx="10" fill="url(#softGreen)" stroke="#72b68c"/>
  <text x="1636" y="356" class="node-title">背景訓練工作</text>
  <text x="1636" y="382" class="node-text mono">rl_trainer.py</text>
  <line x1="1502" y1="363" x2="1520" y2="363" stroke="#1769aa" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="1289" y="438" class="small mono">輸出：模型 checkpoint、訓練紀錄、每日交易結果</text>

  <!-- Right: backtest -->
  <rect x="1265" y="498" width="505" height="284" rx="14" fill="white" stroke="#a9c9e8" stroke-width="2" filter="url(#shadow)"/>
  <text x="1289" y="536" class="card-title">統一回測與基準策略</text>
  <rect x="1289" y="562" width="213" height="86" rx="10" fill="url(#softGreen)" stroke="#72b68c"/>
  <text x="1395" y="594" class="node-title">RL 模型資產曲線</text>
  <text x="1395" y="622" class="node-text">每日重新決策配置</text>
  <rect x="1530" y="562" width="213" height="86" rx="10" fill="url(#softOrange)" stroke="#e9b96e"/>
  <text x="1636" y="594" class="node-title">等權買入持有</text>
  <text x="1636" y="622" class="node-text">首日等額買入後不交易</text>
  <text x="1289" y="684" class="card-subtitle">共同績效指標</text>
  <rect x="1289" y="705" width="98" height="42" rx="8" fill="#eaf4ff"/>
  <text x="1338" y="732" class="metric">總報酬</text>
  <rect x="1399" y="705" width="98" height="42" rx="8" fill="#eaf4ff"/>
  <text x="1448" y="732" class="metric">Sharpe</text>
  <rect x="1509" y="705" width="110" height="42" rx="8" fill="#eaf4ff"/>
  <text x="1564" y="732" class="metric">最大回撤</text>
  <rect x="1631" y="705" width="112" height="42" rx="8" fill="#eaf4ff"/>
  <text x="1687" y="732" class="metric">正報酬日</text>

  <!-- Right: dashboard -->
  <rect x="1265" y="802" width="505" height="254" rx="14" fill="white" stroke="#a9c9e8" stroke-width="2" filter="url(#shadow)"/>
  <text x="1289" y="840" class="card-title">網頁儀表板與研究輸出</text>
  <text x="1289" y="874" class="body">瀏覽器選擇股票、演算法與期間，檢視完整結果。</text>
  <rect x="1289" y="899" width="142" height="108" rx="10" fill="#eef6ff" stroke="#81b3df"/>
  <text x="1360" y="930" class="node-title">回測曲線</text>
  <polyline points="1310,980 1335,963 1360,972 1385,943 1410,954" fill="none" stroke="#1769aa" stroke-width="4"/>
  <rect x="1445" y="899" width="142" height="108" rx="10" fill="#ecf9f0" stroke="#72b68c"/>
  <text x="1516" y="930" class="node-title">每日明細</text>
  <text x="1516" y="960" class="node-text">現金・持股比例</text>
  <text x="1516" y="984" class="node-text">決策・總資產</text>
  <rect x="1601" y="899" width="142" height="108" rx="10" fill="#fff8e9" stroke="#e9b96e"/>
  <text x="1672" y="930" class="node-title">比較輸出</text>
  <text x="1672" y="960" class="node-text">PNG 圖表</text>
  <text x="1672" y="984" class="node-text">Metrics CSV</text>

  <!-- Bottom execution flow -->
  <rect x="30" y="1082" width="1740" height="184" rx="16" fill="white" stroke="#a9c9e8" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="1082" width="1740" height="42" rx="12" fill="#073f78"/>
  <text x="52" y="1111" class="section-title">4. 專案完整執行流程</text>

  <line x1="175" y1="1185" x2="1620" y2="1185" stroke="#b8d5ec" stroke-width="6"/>
  <g>
    <circle cx="175" cy="1185" r="32" fill="#1769aa"/>
    <text x="175" y="1193" class="pill">01</text>
    <text x="175" y="1242" class="body center bold">下載台股資料</text>
  </g>
  <g>
    <circle cx="465" cy="1185" r="32" fill="#1769aa"/>
    <text x="465" y="1193" class="pill">02</text>
    <text x="465" y="1242" class="body center bold">建立交易環境</text>
  </g>
  <g>
    <circle cx="755" cy="1185" r="32" fill="#2f8b57"/>
    <text x="755" y="1193" class="pill">03</text>
    <text x="755" y="1242" class="body center bold">訓練七種模型</text>
  </g>
  <g>
    <circle cx="1045" cy="1185" r="32" fill="#2f8b57"/>
    <text x="1045" y="1193" class="pill">04</text>
    <text x="1045" y="1242" class="body center bold">每日配置回測</text>
  </g>
  <g>
    <circle cx="1335" cy="1185" r="32" fill="#dd7a18"/>
    <text x="1335" y="1193" class="pill">05</text>
    <text x="1335" y="1242" class="body center bold">比較買入持有</text>
  </g>
  <g>
    <circle cx="1620" cy="1185" r="32" fill="#dd7a18"/>
    <text x="1620" y="1193" class="pill">06</text>
    <text x="1620" y="1242" class="body center bold">網頁與圖表輸出</text>
  </g>

  <text x="1760" y="1288" class="tiny" text-anchor="end">Taiwan FinRL Lab・研究用途，不構成投資建議</text>
</svg>
